name: 24/7 Aternos Bot

on:
  schedule:
    - cron: '*/5 * * * *' # Har 5 minute baad check karega
  workflow_dispatch: # Taaki aap manual button daba kar bhi start kar sakein

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Run Aternos Bot
        run: node index.js
